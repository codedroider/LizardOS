name: Build ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Buildroot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev rsync cpio python3 unzip bc wget file ccache

      - name: Restore Buildroot Cache
        uses: actions/cache@v4
        with:
          path: |
            snakeware/buildroot/dl
            ~/.buildroot-ccache
          key: buildroot-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            buildroot-ccache-${{ runner.os }}-

      - name: Build x86-64 ISO
        run: |
          cd snakeware
          chmod +x build.sh
          
          export BR2_CCACHE=y
          export BR2_CCACHE_DIR=~/.buildroot-ccache
          
          BR2_JLEVEL=$(nproc) ./build.sh x86-64

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snakeware-iso
          path: |
            snakeware/**/*.iso
            snakeware/**/output/images/
          if-no-files-found: error
